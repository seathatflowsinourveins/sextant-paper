# One dispatched dsh headless worker on a GitHub-hosted runner.
#
# Sources: GitHub workflow_dispatch/permissions/concurrency documentation and
# the github context's repository.default_branch field, read 2026-11-09;
# PerryLink/dsh-github@2fc0009c:action.yml:51-62,118-161 and
# scripts/action-patch.mjs:49-152; peter-evans/create-pull-request@v8.1.1
# README.md:50-95; actions/create-github-app-token@v3.3.0 action.yml.
# The worker edits only the checked-out workspace. It never receives a broker,
# paper or live key, and runs only on the repository's default branch, so a
# branch rename needs no edit here.
name: dsh-worker
on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'Brief path under .github/dsh-workers/briefs/*.md'
        required: true
        type: string
      slug:
        description: 'Lowercase branch slug, 1-40 characters'
        required: true
        type: string
permissions: {}
jobs:
  worker:
    if: ${{ github.actor == github.repository_owner && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: hosted-workers
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dsh-worker-${{ inputs.slug }}
      cancel-in-progress: false
    env:
      DSH_VERSION: 0.2.2-rc.1
      DSH_GITHUB_VERSION: 0.7.27
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate the brief and slug
        id: brief
        shell: bash
        env:
          BRIEF: ${{ inputs.brief }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [[ ! "$SLUG" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]]; then
            echo "::error::slug must match ^[a-z0-9][a-z0-9-]{0,39}$"
            exit 1
          fi
          if [[ "$BRIEF" != .github/dsh-workers/briefs/*.md ]]; then
            echo "::error::brief must be a .md file under .github/dsh-workers/briefs/"
            exit 1
          fi
          case "/$BRIEF/" in
            *"/../"*|*"/./"*)
              echo "::error::brief must not contain . or .. path segments"
              exit 1
              ;;
          esac
          if [[ ! -f "$BRIEF" ]]; then
            echo "::error::brief does not exist: $BRIEF"
            exit 1
          fi
          PR_BODY="${BRIEF%.md}.pr.md"
          if [[ ! -f "$PR_BODY" ]]; then
            echo "::error::missing pull-request body beside the brief: $PR_BODY"
            exit 1
          fi
          delimiter="BRIEF_$(date +%s)_$RANDOM"
          {
            echo "text<<$delimiter"
            cat "$BRIEF"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "pr_body=$PR_BODY" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dsh and dsh-github
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_PROFILE_DIR: ${{ runner.temp }}/dsh-home/profiles/headless
        run: | # zizmor: ignore[adhoc-packages] copied upstream action install
          set -euo pipefail
          npm install --global --no-audit --no-fund "@deepseek-ai/dsh@${DSH_VERSION}"
          mkdir -p "$DSH_PROFILE_DIR"
          printf '{"private": true}\n' > "$DSH_PROFILE_DIR/package.json"
          npm install --prefix "$DSH_PROFILE_DIR" --legacy-peer-deps --package-lock=false --no-save --no-audit --no-fund "@perrylink/dsh-github@${DSH_GITHUB_VERSION}"

      - name: Compose the parity profile with the hard-lines bundle
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: | # zizmor: ignore[adhoc-packages] copied upstream action install
          set -euo pipefail
          npm install --global --no-audit --no-fund pnpm@11.28.8
          python3 .github/gate/parity-entry.py

      - name: Generate the worker overlay and task from the brief
        id: prepare
        shell: bash
        env:
          INPUT_TASK: report
          INPUT_TASK_PROMPT: ${{ steps.brief.outputs.text }}
          INPUT_OWNER_REPO: ${{ github.repository }}
          INPUT_OUTPUT_DIR: ${{ runner.temp }}/dsh-worker
        run: node .github/actions/dsh-github/scripts/action-patch.mjs

      - name: Retain max effort and the headless service patch
        shell: bash
        env:
          WORKER_OUT: ${{ runner.temp }}/dsh-worker
        run: |
          set -euo pipefail
          cat config/dsh/mcp/max-effort.cordis.yml >> "$WORKER_OUT/dsh-github-ci.cordis.yml"
          cat .github/gate/headless-services.cordis.yml >> "$WORKER_OUT/dsh-github-ci.cordis.yml"

      - name: Disable the review-only guards and set the worker persona
        shell: bash
        env:
          WORKER_OUT: ${{ runner.temp }}/dsh-worker
        run: |
          set -euo pipefail
          cat >> "$WORKER_OUT/dsh-github-ci.cordis.yml" <<'YAML'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              text: |
                You are a hosted Sextant worker. Follow the task brief exactly.
                Work only inside the checked-out repository. Do not run git, push,
                call GitHub APIs, or touch a broker, paper or live account.
                Finish by stating the files you changed.
              complete: true
              includeRuntimeContext: false

          - id: sextant-gate-api-only
            disabled: true

          - id: dsh-github
            disabled: true
          YAML

      - name: Run the dsh headless worker
        id: worker
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          WORKER_OUT: ${{ runner.temp }}/dsh-worker
          DSH_PERMISSION_MODE: workspace-write
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          dsh --profile headless --patch "$WORKER_OUT/dsh-github-ci.cordis.yml" "$(cat "$WORKER_OUT/task.txt")"

      - name: Mint the pull-request app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SEXTANT_APP_ID }}
          private-key: ${{ secrets.SEXTANT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the worker pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: dsh-worker/${{ inputs.slug }}
          base: ${{ github.event.repository.default_branch }}
          title: 'dsh worker: ${{ inputs.slug }}'
          body-path: ${{ steps.brief.outputs.pr_body }}
          commit-message: 'dsh worker: ${{ inputs.slug }}'
          delete-branch: true

      - name: Require a pull request
        if: steps.cpr.outputs.pull-request-number == ''
        shell: bash
        run: |
          echo "::error::the worker made no change, so no pull request was opened"
          exit 1
