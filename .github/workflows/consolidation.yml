# The weekly consolidation report (#90), for the owner's "automated sota maintanced consolidation"
# (#58, 6711818587). Maintained tools list dead code and duplicate blocks in src, with per-module lines
# and the headroom under the cap, and the job posts one comment. A writer turns the safe findings into
# PRs; a later cap raise cites the latest report (#205). It runs trusted default-branch code
# from a read-only checkout, no secrets and no Docker. Its writes are the report issue when none exists and one comment on it.
# Sources: jendrikseipp/vulture@v2.16 and pylint-dev/pylint@v4.1.3 (duplicate-code, R0801); docs/manifest.md.
name: consolidation
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: consolidation
  cancel-in-progress: false
jobs:
  report:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.actor == github.repository_owner) }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Compose the report
        run: |
          set -euo pipefail
          export LC_ALL=C
          tools=(uv run --frozen --only-group dev --only-group consolidation)
          cap=$(sed -nE 's/.*\(ROOT \/ "src"\)\.rglob\("\*\.py"\)\) < ([0-9_]+)$/\1/p' tests/repo/test_budgets.py | tr -d _)
          [[ -n "$cap" ]] || { echo 'No src cap found in tests/repo/test_budgets.py.' >&2; exit 1; }
          week=$(git rev-list -1 --before='7 days ago' HEAD)
          # Lines per src/sextant module at a commit, counted as test_budgets counts them.
          count() {
            git ls-tree -r --name-only "$1" -- src | grep '\.py$' | while read -r file; do
              module=$(cut -d/ -f3 <<< "$file"); [[ "$module" != *.py ]] || module='(top level)'
              printf '%s\t%s\n' "$module" "$(git show "$1:$file" | wc -l)"
            done | awk -F'\t' '{s[$1] += $2} END {for (m in s) print m "\t" s[m]}' | sort
          }
          count HEAD > now.tsv
          if [[ -n "$week" ]]; then count "$week" > week.tsv; else : > week.tsv; fi
          # A protocol parameter, checked by hand: vulture can't see its callers' keyword use.
          "${tools[@]}" vulture src --min-confidence 60 --sort-by-size \
            --ignore-names confidence_multiplier > vulture.txt || [[ $? == 3 ]]
          "${tools[@]}" pylint --disable=all --enable=duplicate-code --min-similarity-lines=4 \
            --ignore-comments=y --ignore-docstrings=y --ignore-imports=y --ignore-signatures=y \
            --output-format=json2 --exit-zero src > pylint.json
          "${tools[@]}" ruff check src --select F --output-format concise --exit-zero > ruff.txt
          ruff_f=$(grep -c '^src/' ruff.txt || true)
          confidence() { sed -nE 's/.*\(([0-9]+)% confidence.*/\1/p' <<< "$1"; }
          total=$(awk -F'\t' '{t += $2} END {print t + 0}' now.tsv)
          before=$(awk -F'\t' '{t += $2} END {print t + 0}' week.tsv)
          if [[ -n "$week" ]]; then since="This week: $((total - before)) from main ${week:0:7}."; else since='No main commit is a week old yet.'; fi
          {
            echo "## Consolidation report: main ${GITHUB_SHA:0:7}, $(date -u +%F)"
            echo
            echo "**src:** ${total} lines under a cap of ${cap}, so $((cap - total)) lines of headroom. ${since}"
            echo
            echo '| Module | Lines | Week |'
            echo '|---|---:|---:|'
            join -t $'\t' -a 1 -a 2 -e 0 -o 0,1.2,2.2 now.tsv week.tsv |
              awk -F'\t' -v base="$week" '{printf "| %s | %d | %s |\n", $1, $2, base == "" ? "n/a" : sprintf("%+d", $2 - $3)}'
            echo
            echo '### Dead code (vulture 2.16)'
            echo
            echo '**Safe, 80% confidence or more.** Each is a deletion PR for a writer, after a caller check:'
            safe=0
            while IFS= read -r line; do
              [[ -n "$line" ]] || continue
              if (( $(confidence "$line") >= 80 )); then echo "- \`${line}\`: delete it."; safe=$((safe + 1)); fi
            done < vulture.txt
            (( safe )) || echo '- none'
            echo
            review=$(while IFS= read -r line; do [[ -z "$line" ]] || (( $(confidence "$line") >= 80 )) || echo "$line"; done < vulture.txt)
            echo "**Review, 60 to 79%:** $(grep -c . <<< "$review" || true) findings. Check callers, then delete or name the false positive in this workflow. The largest:"
            # vulture's --sort-by-size is smallest first, so rank by its "N lines" here.
            # The backticks are literal Markdown code spans, not command substitution (ShellCheck SC2016).
            # shellcheck disable=SC2016
            sed -nE 's/^(.*, ([0-9]+) lines?\))$/\2\t\1/p' <<< "$review" | sort -t $'\t' -k1,1nr | head -n 10 | cut -f2- | sed 's/.*/- `&`/'
            echo
            echo '### Duplicate blocks (pylint 4.1.3 duplicate-code, 4 lines or more, ignoring comments, docstrings, imports and signatures)'
            echo
            jq -r '[.messages[] | select(.symbol == "duplicate-code") | .message | split("\n")
                | map(select(startswith("==")) | ltrimstr("==") | capture("^(?<m>[^:]+):\\[(?<a>[0-9]+):(?<b>[0-9]+)\\]$"))
                | map({path: ("src/" + (.m | gsub("\\."; "/")) + ".py"), a: (.a | tonumber), b: (.b | tonumber)})]
              | if length == 0 then "- none" else .[] | "- `" + (map("\(.path):\(.a)-\(.b)") | join("` ~ `"))
                + "` (\(.[0].b - .[0].a) lines): fold into one helper." end' pylint.json
            echo
            echo "### ruff F rules"
            echo
            echo "${ruff_f} findings. ci enforces these, so anything here is a regression."
          } > report.md
          cat report.md
      - name: Find or create the consolidation issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Consolidation report"
          number="$(gh issue list --repo "$GH_REPO" --state all --search "\"$title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [[ -z "$number" ]]; then
            url=$(gh issue create --repo "$GH_REPO" --title "$title" --body-file report.md)
            number="${url##*/}"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
      - name: Post it once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: gh issue comment "$ISSUE" --repo "$GH_REPO" --body-file report.md
