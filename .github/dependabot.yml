version: 2
updates:
  - package-ecosystem: npm
    directories: [/.devcontainer/agents, /config/dsh]
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
  # pnpm moves only with dsh-tui's toolchain (11.21.0, pinned by the dsh proof).
  - package-ecosystem: npm
    directory: /deploy/wsl/dsh
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: pnpm
  - package-ecosystem: npm
    directory: /.devcontainer/qmd
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 1
  - package-ecosystem: uv
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: nautilus-trader
      - dependency-name: alpaca-py
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 1
