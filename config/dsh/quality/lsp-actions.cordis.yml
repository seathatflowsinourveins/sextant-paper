# dsh-lsp-actions 0.5.17: its bundle patch documents `servers` (command +
# extensionToLanguage required; the default {} activates no servers), and its
# README's routing example gives the typescript entry's shape. An id-targeted
# override replaces the row's whole config, so every bundle-default key is
# restated. Commands resolve on PATH at load (README Configuration): the
# sandbox lock's own binaries (.devcontainer/agents/package.json: pyright
# 1.1.414, whose langserver entry is pyright-langserver, and
# typescript-language-server 6.0.3), as the Claude shelf's LSP rows pin them.
- id: lsp-actions
  config:
    servers:
      pyright:
        command: pyright-langserver
        args: ["--stdio"]
        extensionToLanguage: {".py": python, ".pyi": python}
        projectMarkers: ["pyproject.toml", "pyrightconfig.json"]
      typescript:
        command: typescript-language-server
        args: ["--stdio"]
        extensionToLanguage: {".ts": typescript, ".tsx": typescriptreact, ".js": javascript, ".mjs": javascript}
        projectMarkers: ["package.json", "tsconfig.json"]
    editor:
      enabled: false
      requestTimeoutMs: 60000
      diagnosticsCacheMaxFiles: 64
    maxDiagnostics: 200
    maxCompletionItems: 20
    maxCodeActions: 50
    maxSymbols: 100
    maxSignatures: 10
    maxInlayHints: 200
    maxResultChars: 16000
    timeoutMs: 60000
