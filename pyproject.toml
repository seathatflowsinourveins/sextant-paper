# Generalised from Sextant's pyproject.toml (see ORIGINS.md): the trading runtime dependencies,
# the TradingView extra and the build system are removed; the tool settings and the dev pins
# are Sextant's, unchanged. Without [build-system], uv does not build or install the project
# (docs.astral.sh/uv/concepts/projects/config/#build-systems). Run `uv lock` once after adoption.
[project]
name = "harness-template"
version = "0.1.0"
description = "Reusable agent harness: the never-self-invent gate, review routing and upkeep automation"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-xdist==3.8.0", "ruff==0.17.4", "zizmor==1.32.0"]
# The weekly consolidation report only (.github/workflows/consolidation.yml); ci never installs it.
# mypy-extensions, which isort needs at 1.1.0 or later, is held at 1.1.0: 1.2.0 is under two weeks old.
consolidation = ["vulture==2.16", "pylint==4.1.3", "mypy-extensions==1.1.0"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests/repo", "tests/proofs"]
# Proofs that need the devcontainer itself, live GitHub settings, or the maintainer's own tools
# are deselected by default, so `ci` runs the rest. `just prove` selects host proofs by default;
# pass `-m` (for example `just prove github`) to widen it. pytest docs, "Registering marks".
markers = [
  "container: needs the sandbox container; runs in the devcontainer build, not the host",
  "host: holds in a host checkout; the default `just prove` scope",
  "github: asserts live GitHub settings and needs the maintainer's admin token",
  "local: needs the maintainer's own tools or login (the gitleaks binary, gh admin reads); deselected by default, so CI's read-only token skips it",
]
pythonpath = ["src"]
addopts = "-q -m 'not container and not local'"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
