[project]
name = "sextant-paper"
version = "0.1.0"
description = "Paper loop and TradingView display with a cited ci-only harness"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alpaca-py==0.44.0",
    "exchange-calendars==4.13.2",
    "nautilus-trader[visualization]==2.0.0rc8",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[tool.uv.sources]
requests = { git = "https://github.com/psf/requests", rev = "6e83187b8feb273ed4c6cdab5efd8d54901dfab3" }

[project.optional-dependencies]
tradingview = ["mcp==2.3.0", "httpx2==2.16.0", "jsonschema==4.26.0", "exchange-calendars==4.13.2"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-xdist==3.8.0", "ruff==0.17.4", "zizmor==1.32.0", "mcp==2.3.0", "httpx2==2.16.0", "jsonschema==4.26.0", "exchange-calendars==4.13.2"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sextant"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests/repo", "tests/proofs"]
# Proofs that need the devcontainer itself, live GitHub settings, or the maintainer's own tools
# are deselected by default, so `ci` runs the rest. `just prove` selects host proofs by default;
# pass `-m` (for example `just prove github`) to widen it. pytest docs, "Registering marks".
markers = [
  "container: needs the sandbox container; runs in the devcontainer build, not the host",
  "host: holds in a host checkout; the default `just prove` scope",
  "github: asserts live GitHub settings and needs the maintainer's admin token",
  "local: needs the maintainer's own tools or login (the gitleaks binary, gh admin reads); deselected by default, so CI's read-only token skips it",
]
pythonpath = ["src"]
addopts = "-q -m 'not container and not local'"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
